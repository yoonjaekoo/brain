<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>구윤재는 탈모다</title>
    <style>
        body {
            background-color: #000000; /* 검정색 (#000000) */
            /* 만약 다른 색을 원하시면 아래처럼 쓰세요:
               background-color: darkblue; 
               background-color: #1a1a1a; (진한 회색)
            */
            display: flex;
            flex-direction: column;
            align-items: center; /* 가로 중앙 정렬 */
            justify-content: center; /* 세로 중앙 정렬 */
            min-height: 100vh; /* 화면 꽉 채우기 */
            margin: 0;
        }
        h1 {
            /* 무지개색 그라데이션 설정 */
            background: linear-gradient(to right, red, orange, yellow, green, blue, indigo, violet, red);
            /* 배경을 글자 크기에 맞춤 */
            background-size: 200% auto;
            /* 배경을 글자 색상으로 적용 */
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            /* 애니메이션 실행: 3초 동안 무한 반복 */
            animation: rainbow 0.5s linear infinite;
            font-size: 3rem; /* 글자 크기는 취향껏 조절하세요 */
        }
        p {
            /* 무지개색 그라데이션 설정 */
            background: linear-gradient(to right, red, orange, yellow, green, blue, indigo, violet, red);
            /* 배경을 글자 크기에 맞춤 */
            background-size: 200% auto;
            /* 배경을 글자 색상으로 적용 */
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            /* 애니메이션 실행: 3초 동안 무한 반복 */
            animation: rainbow 0.5s linear infinite;
            font-size: 1; /* 글자 크기는 취향껏 조절하세요 */
        }

        /* 배경이 왼쪽에서 오른쪽으로 흐르게 하는 애니메이션 */
        @keyframes rainbow {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }
    </style>
</head>
